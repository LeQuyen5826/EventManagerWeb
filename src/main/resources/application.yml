spring:
  application:
    name: eventmanagement
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

app:
  jwt:
    # >= 32 ký tự. Khi triển khai thật: đặt biến môi trường JWT_SECRET, không commit lên Git
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-0123456789abcdef}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  event:
    require-approval: ${EVENT_REQUIRE_APPROVAL:false}   # FR59: bật/tắt duyệt sự kiện
    cancel-before-hours: ${CANCEL_BEFORE_HOURS:24}      # BR05
    checkin-open-before-minutes: ${CHECKIN_OPEN_BEFORE_MINUTES:60}   # BR06
  mail:
    from: ${MAIL_FROM:no-reply@eventmanagement.local}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
  seed:
    enabled: true
    admin-email: ${ADMIN_EMAIL:admin@example.com}
    admin-password: ${ADMIN_PASSWORD:Admin@12345}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
