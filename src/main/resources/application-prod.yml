# Profile prod: MySQL + SMTP thật (SmtpEmailSender)
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/event_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  seed:
    enabled: false                        # không tạo dữ liệu demo
    admin-password: ${ADMIN_PASSWORD}     # bắt buộc đặt biến môi trường khi chạy prod
